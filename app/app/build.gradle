plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lingdong.island'
    compileSdk 35

    defaultConfig {
        applicationId "com.lingdong.island"
        minSdk 28
        targetSdk 35
        versionCode 115
        versionName "8.68"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}



